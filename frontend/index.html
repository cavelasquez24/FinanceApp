<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finflow-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F4" />

    <!-- Pantalla completa al "Agregar a inicio". El manifest con
         display:standalone es la vía que iOS 16.4+ honra; los meta de Apple
         se mantienen como respaldo para versiones anteriores, donde siguen
         siendo el único mecanismo. Sigue sin haber service worker: no es una
         PWA instalable ni funciona offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinFlow" />
    <!-- TODO: falta public/apple-touch-icon.png (180x180). Sin él iOS usa una
         miniatura de la página como icono de la pantalla de inicio. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>FinFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
